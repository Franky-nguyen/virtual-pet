name: Build Cross-Platform Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            os_label: linux
          # Build both native macOS architectures. macos-latest is arm64;
          # macos-15-intel keeps Intel Mac users supported too.
          - platform: macos-latest
            os_label: macos-arm64
          - platform: macos-15-intel
            os_label: macos-x64
          - platform: windows-latest
            os_label: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri & packaging dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libgl1 \
            libglib2.0-0 \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Ensure MediaPipe pose model is present
        shell: bash
        run: |
          if [ ! -f pose_landmarker_heavy.task ]; then
            curl -fsSL \
              "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task" \
              -o pose_landmarker_heavy.task
          fi

      - name: Install frontend dependencies
        shell: bash
        run: npm install

      - name: Build Unix detector & Tauri installers (Linux / macOS)
        if: matrix.platform != 'windows-latest'
        env:
          NO_STRIP: 'true'
        run: |
          set -o pipefail
          chmod +x ./build-installer.sh ./PosturePet.sh ./PosturePet.command
          bash ./build-installer.sh 2>&1 | tee "build-${{ matrix.os_label }}.log"
          if [[ "${{ matrix.platform }}" == macos-* ]]; then
            arch="$(uname -m)"
            for dmg in PosturePet_Installer/*.dmg; do
              [ -e "$dmg" ] || continue
              mv "$dmg" "${dmg%.dmg}-${arch}.dmg"
            done
            for app in PosturePet_Installer/*.app; do
              [ -d "$app" ] || continue
              ditto -c -k --keepParent "$app" "${app%.app}-${arch}-macOS.zip"
              rm -rf "$app"
            done
          fi

      - name: Surface Unix build failure details
        if: failure() && matrix.platform != 'windows-latest'
        shell: bash
        run: |
          log="build-${{ matrix.os_label }}.log"
          if [ -f "$log" ]; then
            echo "Last build output from $log:"
            tail -n 60 "$log"
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              safe="${line//'%'/'%25'}"
              safe="${safe//$'\r'/'%0D'}"
              safe="${safe//$'\n'/'%0A'}"
              echo "::error file=$log::$safe"
            done < <(tail -n 20 "$log")
          fi

      - name: Build Windows detector & NSIS installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --onefile --noconsole --clean --collect-all mediapipe --add-data "pose_landmarker_heavy.task;." detector.py
          Move-Item -Force dist\detector.exe .\detector.exe
          npx tauri build
          New-Item -ItemType Directory -Force -Path PosturePet_Installer | Out-Null
          Copy-Item -Force src-tauri\target\release\bundle\nsis\*.exe PosturePet_Installer\

      - name: Upload installer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PosturePet-${{ matrix.os_label }}-installer
          path: |
            PosturePet_Installer/*
            build-${{ matrix.os_label }}.log
          if-no-files-found: warn

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PosturePet_Installer/*
